<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202842"/>
      <stop offset="1" stop-color="#141a2c"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#45b4ff"/>
      <stop offset="1" stop-color="#5b5bf0"/>
    </linearGradient>
    <linearGradient id="chev" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fd0ff"/>
      <stop offset="1" stop-color="#5aa0ff"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9f7ff"/>
      <stop offset="1" stop-color="#8fdcff"/>
    </linearGradient>
    <clipPath id="win">
      <rect x="56" y="120" width="912" height="784" rx="88"/>
    </clipPath>
  </defs>
  <!-- window -->
  <g clip-path="url(#win)">
    <rect x="56" y="120" width="912" height="784" fill="url(#body)"/>
    <rect x="56" y="120" width="912" height="150" fill="url(#bar)"/>
    <rect x="56" y="268" width="912" height="6" fill="#000" opacity="0.18"/>
  </g>
  <rect x="58" y="122" width="908" height="780" rx="86" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>
  <!-- prompt -->
  <path d="M232 430 L388 560 L232 690" fill="none" stroke="url(#chev)" stroke-width="76" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- raindrop cursor -->
  <path fill="url(#drop)" d="M600 418 C 600 418 506 540 506 612 C 506 668 548 712 600 712 C 652 712 694 668 694 612 C 694 540 600 418 600 418 Z"/>
  <rect x="736" y="664" width="104" height="44" rx="22" fill="#7fd0ff" opacity="0.55"/>
