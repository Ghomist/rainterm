[package]
name = "rainterm"
version = "0.6.0"
description = "A fast, beautiful terminal"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rainterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "process"] }
russh = { version = "0.65.1", default-features = false, features = ["ring", "flate2", "rsa"] }
portable-pty = "0.9.0"
window-vibrancy = "0.8.1"
anyhow = "1.0.104"
parking_lot = "0.13.0"
dirs = "7.0.0"
uuid = { version = "1.29.2", features = ["v4"] }
async-trait = "0.1.92"
regex = "1.13.1"
russh-sftp = "3.0.1"
keyring = "4.2.0"
serialport = { version = "4.10.1", default-features = false }
tauri-plugin-dialog = "2"
trash = "5.3.0"
tauri-plugin-window-state = "2"
sysinfo = "0.40.4"
# Built-in agent: model APIs over HTTPS (ring, like russh; no aws-lc / cmake needed).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream", "http2", "socks", "charset"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"
tauri-plugin-notification = "2"
getrandom = "0.3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
